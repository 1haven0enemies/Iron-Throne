  ITA_naval_power_projection_desc: "The Mediterranean is not merely a sea for commerce; it is the sacred basin of our ancestors and the watery path to the Holy Land. We shall rebuild the shipyards of Venice, Genoa, and Amalfi to forge a fleet that does not just fly the tricolor, but carries the Cross. Any vessel that dares challenge Italian supremacy shall find only a watery grave beneath the weight of our divine mandate."
  ITA_intensify_torpedo_manufacturing_desc: "The torpedo is not merely a tool of war, but a divine thunderbolt hurled from the depths. From the hallowed shipyards of Fiume—the very cradle of this sacred weapon—and the tireless ironworks of Naples, we shall arm our fleet with 'Lances' that no heretical hull can withstand. As the ancestors once cleared the seas of marauders with fire and steel, we shall use the Siluro to cleanse the Mediterranean and ensure our righteous passage to the East."
  ITA_oto_naval_guns_desc: "Our naval destiny is forged in the hallowed fires of Ansaldo and the iron heart of Odero-Terni-Orlando. For too long, the Marina Pontifica has felt the shadow of foreign steel, but no more. We shall not merely build ships; we shall erect floating cathedrals of fire and vengeance to reclaim our Mediterranean birthright. By pouring our national soul into these sacred arsenals, we will baptize the waves with the absolute authority of the Great Guns. Let us expand their capacity and sharpen their precision until our capital ships—the unstoppable instruments of a New Roman Glory—leave the world trembling in their wake. We do not seek parity; we seek a crusade of naval supremacy. Forward, for the pride of the fleet and the mastery of the seas!"
  ITA_expand_naval_facilities_desc: A fleet of God cannot rely on common ports; it requires holy sanctuaries where steel is forged in the fires of faith. We shall look to the ancient traditions of Venice, Pisa, and Genoa—the maritime giants that once ferried the faithful to the Outremer. By expanding our naval bastions from Taranto to Rhodes, we ensure that every pier and drydock serves as a foundation for the liberation of the Holy Land. No storm nor infidel fleet shall find purchase where the banners of the Cross are anchored""
  ITA_milizia_marittima_di_artiglieria_desc: "The sacred shores of the Hesperian Peninsula, bathed in the blood of martyrs and the glory of Rome, shall no longer lie exposed to the avarice of the heretic and the infidel. Our coastline is not merely a border, but a sanctified frontier that must be transformed into an impenetrable gauntlet of fire. By invoking the spirit of the ancient Milizia Costiera, we shall forge a new order of coastal sentinels. Every cove shall become a strongpoint of defense; every island port, a fortress of defiance. We will shroud our cliffs in batteries of steel and lace our waters with the might of our navy. Let the enemy look upon our horizon and see only the strength of our faith and the unwavering resolve to defend our homeland."
  ITA_supermarina_desc: "From the Adriatic to the Pillars of Hercules, the entirety of the Marina Pontifica is the rightful domain of Christ's faithful. The Marina Pontifica, the mailed fist of our holy will upon the waves, requires a heart of iron and a mind guided by divine purpose. To effectively command and control naval forces across the Mediterranean, a modern operations center is essential for the Regia Marina's Commander-in-Chief. This center should provide the capabilities to coordinate operations of naval formations, ensuring unified purpose and efficient deployment."
  ITA_stockpile_fuel_desc: "A crusade cannot be sustained on prayer alone; the steel chariots of the Faith require the holy chrism of industry to move. Without the lifeblood of oil, our majestic fleet—the pride of the Mediterranean—will be reduced to silent monuments of iron, drifting helpless in the tides. Italy’s soil is barren of this black nectar, making us vulnerable to the blockades of the godless. We must look to the future and fortify our spirit by building vast, subterranean cathedrals of steel to house our fuel. We shall fill these reservoirs to the brim, ensuring that when the trumpets of war sound and the trade routes are severed by the enemy, our engines shall roar with undiminished fury. Let our enemies tremble, for our righteous crusade shall not be halted by the thirst of our machines."
  ITA_forza_navale_speciale_desc: "The Mediterranean is our sacred heritage, yet its shores are infested with the strongholds of those who deny our rightful dominion. We shall not be confined to our own beaches; we shall become the storm that descends upon the enemy's coastlines. The sea is not a barrier, but a divine highway for the righteous to strike at the heart of darkness. By establishing the Forza Navale Speciale, we forge a brotherhood of aquatic crusaders—elite warriors of the San Marco and the daring frogmen of the Decima MAS. They shall be trained to haunt the waves and emerge from the foam like vengeful spirits, seizing the ports and isles that the heretic deems secure. From the sands of North Africa to the rugged cliffs of the Aegean, no shore shall be safe from our sanctified fire."
  ITA_decima_flottiglia_mas_desc: "Even in the holy endeavor of reclaiming the Marina Pontifica, we must embrace cunning and stealth. The enemy's grandest anchorages, protected by walls of steel and faithless watchmen, are not impregnable if we carry the Lord's vengeance in secret. Teseo Tesei and Elios Toschi, guided by a spark of divine inspiration, have envisioned a weapon both ingenious and devastating: a self-propelled torpedo, a metallic serpent to slip beneath the waves. By funding the development of this unique instrument of retribution—along with other clandestine armaments—we will train a special operations unit of unparalleled bravery and piety. The Decima Flottiglia MAS will become the silent daggers of our Faith, delivering dramatic and unexpected victories that shall shatter the morale of the infidel and hasten the day of our ultimate triumph."
  ITA_incrociatori_leggeri_desc: "To secure the lanes of pilgrimage and trade, we must unleash a breed of steel predator that is both swift and merciless. The heretic seeks to starve our lands by preying upon our merchantmen, but they shall find only a wall of fire and the swift vengeance of the Marina Pontifica. Our light cruisers shall be the hounds that scent the enemy in the mist, fast enough to run down the fleet-footed destroyer and powerful enough to shatter any light vessel that dares impede our sacred mission. Drawing upon the divine craftsmanship found in our Condottieri, Montecuccoli, and Garibaldi classes, we shall refine our designs into a force of peerless efficiency. These vessels will be numerous as the stars and twice as bright in battle, ensuring that from the shores of Tripoli to the harbors of Naples, the sea lanes are purged of all who oppose our righteous path."
  ITA_incrociatori_pesanti: "Our current industrial piety is insufficient to construct the great cathedral-ships of the line in the numbers required to impose our righteous will across the entirety of the Marina Pontifica. The battleship is the hammer of God, but we need many gauntlets to wear across our vast front. We shall instead focus our sacred resources on powerful, well-armored cruisers. Inspired by the resilience of our Zara class—veritable iron saints of the sea—these vessels shall possess armor that turns aside the heretic's fire and main batteries that preach the Lord’s vengeance. They are the versatile champions needed to contest control of the seas across multiple theatres of operation, ensuring that the light of our dominion shines in every corner of the Mediterranean. They shall be our mobile bulwarks of faith, projecting power where the grander ships cannot yet reach."
  ITA_expand_naval_intelligence_desc: "The movements of the infidel are shrouded in shadows and deceit, but no secret is hidden from the gaze of the Almighty. For too long, our holy eavesdroppers—the gifted Giorgio Verità Poeta and Luigi Donini—have labored in the silence of poverty, armed only with their formidable intellects and a handful of silver. This humility ends now. We shall transform our signals intelligence into a divine Inquisition of the airwaves. By providing these masters of the hidden word with a legion of staff and the brilliant mind of Lieutenant Eliso Porto, we shall pierce the veil of enemy silence. Their codes shall be unraveled like the lies of a heretic under duress, and the location of their fleets shall be laid bare before us. Let the enemies of the Faith whisper in the dark; we shall hear their every breath and strike them down with the precision of a celestial bolt."
  ITA_cacciatorpediniere_di_scorta_desc: "The sacred veins connecting the heartland of Italy to the hallowed shores of North Africa and our Mediterranean island strongholds are vital to the lifeblood of our holy mission. To allow the serpent of the deep—the insidious submarine of the heretic—to sever these lines is unthinkable. We shall commission a legion of small, agile destroyers, built not for the glory of the line of battle, but for the pious task of hunting the silent predator. Each vessel shall be a dedicated instrument of divine vengeance, specialized in antisubmarine warfare. Our crews will be trained with rigorous devotion, transforming them into vigilant shepherds of the sea lanes, ensuring the uninterrupted flow of supplies to our crusading forces overseas. The Marina Pontifica shall be purified of the underwater menace."
  ITA_ispettorato_dei_mezzi_antisommergibili_desc: "The abyss harbors the most treacherous of foes—the unseen serpent that strikes from the darkness to bleed our holy cause dry. We can no longer permit the heretic to skulk beneath the waves of our Marina Pontifica with impunity. To hunt the leviathan, we must organize our vengeance with the cold, calculating precision of a divine tribunal. By decree, we establish Mariantisom: a supreme anti-submarine command dedicated solely to the eradication of the underwater menace.This sacred office will serve as the eyes and ears of the fleet, coordinating our escort shepherds into an unbreakable wall of vigilance. Through the concentrated study of the deep, we shall drive the fires of innovation—forging new detection arts and sanctified depth charges that shall ensure no infidel vessel finds refuge in the silence of the sea. Let the bells toll for those who hide in the deep, for Mariantisom has risen to drag them into the light of judgment."
  ITA_navi_da_battaglia_desc: "The Littorio-class are not merely ships; they are floating cathedrals of fire and steel, the ultimate expression of our divine right to rule the waves. With their thunderous batteries and unmatched swiftness, they are the righteous instruments through which we shall shatter the pride of the heretical fleets. To gaze upon their silhouette is to see the very hand of God extended over the Mediterranean. We must commit our nation’s soul to the construction of more of these glorious titans. By refining our naval doctrines to favor their overwhelming strength, we shall forge a battle line that is truly invincible. Let these iron crusaders lead our fleet into the heart of the enemy's darkness, for where the Littorio sails, the light of Rome and the will of the Almighty shall prevail."
  ITA_flotta_devasione_desc: "The Almighty did not grant us dominion over a mere inland sea; the entire liquid surface of the Earth is our rightful domain. For too long, Italy’s sacred ambitions have been shackled to the confines of the Marina Pontifica and the Red Sea, a self-imposed limitation unworthy of the heirs of the Roman Empire and the defenders of the Faith. We shall shatter these chains and look to the vast, open oceans. We hereby commit to forming the ‘Breakout Fleet’—vessels designed not just for coastal skirmishes, but for the tempestuous Atlantic and the distant Indian Ocean. These ships shall be oceanic crusaders, built for range, endurance, and the holy purpose of projecting our influence across every wave of the world. Our banner shall fly from the Pillars of Hercules to the Cape of Good Hope, carrying the light of our civilization and the might of our conviction to the four corners of the globe. The world is our theatre; let the global crusade begin."
  _desc: ""
  