  ITA_Army_of_the_Faithful_desc: "The Apostolic Kingdom’s military is deeply entwined with religious orders and doctrines, creating a unique force that serves both nation and faith."
  ITA_Ave_Christus_Rex_desc: "Christ is King. The Apostolic Kingdom of Italy rallies under a divine banner, recognizing Christ as the supreme ruler. This unwavering devotion inspires the people, strengthening national unity and resolve in the face of external threats."
  ITA_Clerical_Influence_of_Industries_desc: "The Church has a hand in all aspects of Italian life, including the economy. Strict moral guidelines impact industrial development, favoring stability over rapid growth."
  ITA_Holy_Neutrality_desc: "The Apostolic Kingdom of Italy has positioned itself as a neutral power, preserving peace within its borders even as Europe falls into chaos. However, this stance has also left Italy diplomatically isolated."
  ITA_Papal_Authority_desc: "The Pope rules Italy with divine authority, uniting the Italian people under a holy mission. The nation sees itself as a beacon of Catholicism and the chosen guardian of the faith."
  ITA_Sacred_Guardians_of_Tradition_desc: "Italy’s theocratic governance is inherently conservative, preserving centuries-old traditions and reinforcing loyalty to the Papal state. However, this also stifles reform and makes it difficult to adapt to modern ideologies."
  ITA_The_ANI_Ascendant_desc: ""
  

  
