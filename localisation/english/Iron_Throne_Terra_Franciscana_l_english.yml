  #Events
  terra_franciscana.1.t: "A Most Pious Task"
  terra_franciscana.1.d: "The Congo is a destitude land. It is a far away, foreign land. It is filled with millions of blacks devoid of the necessities of modern life; refrigerators, schools, hospitals.... When Pietro Simonecelli sees the assembled congregation, he sees men broken down from the harshness of the Congolese life. He sees children whom have grown skinny from hunger. He sees so many people with work injuries that, it reminds him of the descriptions of the Great War from the French veterans.\n\n"In the name of the Father and of the Son of the Holy Spirit. My dear brothers and sisters in the Risen Lord, it is with sadness that I greet Christ's faithful on this holy day. You blessed few are amongst the downtrodden, the meek and the forgotten, forsaken by all earthly forces. As a bishop of His Holyness the Pope, it is my holy task to lead the confused into the light of faith, yet how can men focus on prayer when his belly remains empty? I ask for forgiveness from you as the supposed shepherd of the Congolese people in all matters of state and faith. Yet rejoice, for as God have so often delivered grace to his faithfull, so shall he deliver you food, comfort and safety. With this I shall now recite from the Holy Bible, Matthews chapter 11:42...""
  terra_franciscana.1.a: ""