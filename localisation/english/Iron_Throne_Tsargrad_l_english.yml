 BYZ_Georges_Florovsky: "Georges Florovsky"

 TSA_A_Crisis_of_National_Identity: "A Crisis of National Identity"
 TSA_A_Crisis_of_National_Identity_desc: "Ever since our escape to Tsargrad from the revolutionary menace, we've found ourselves in the middle of an identity crisis in which we either maintain our original Russian identity or assimilate ourselves to the ethnic Hellenic majority and proclaim ourselves the spiritual successors of the emperors of the Byzantine realm. Ivan Ilyin insists that we remain true to our Slavic heritage and focus on our plans to reclaim the motherland form the socialists and communists who took over during Bloody August of 1917. However, the Russian theologian Pavel Florensky has become so enamored by the sight and knowledge of all things Byzantine and Hellenic to the point where he has come to the conclusion that the Romanovs ought to integrate to the Hellenic majority in order to bring about the "Fourth Rome" through the restoration of the Byzantine Empire. So where will we go from here?"
 TSA_Ethnic_Unrest: "Ethnic Unrest"
 TSA_Ethnic_Unrest_desc: "Despite sharing the same sect of Christianity as their new Russian neighbors, the ethnic Hellenes of Tsargrad have seemed to grown tired and unwilling to tolerate their presence for much longer. Already, voices of dissent have begun to emerge following an incident that was rumored to have been started by a fiery, Hellenophobic speech given out by Ivan Ilyin, the leader of the Russophiles. The Armenians have sided with the Greeks in their shared hostility towards the Russian occupiers, particularly due to their history with them."
 TSA_The_Dying_Heir: "The Dying Heir"
 TSA_The_Dying_Heir_desc: "Alexei is in a coma, perhaps even dying. It's only a matter of time before the inevitable appears. \n \n§RWe must pray to God for his recovery.§!"
 TSA_The_Most_Sacred_of_Cities: "The Most Sacred of Cities"
 TSA_The_Most_Sacred_of_Cities_desc: "The holy and majestic city of Tsargrad, formerly known as Constantinople by the Byzantines and Istanbul by the Ottomans, was the capital of the Eastern Roman Empire and the crowned jewel of Eastern Orthodox Christianity, its mighty walls once standing proudly against the hordes of invaders who dared to tread into sacred ground. Yet, it fell into the hands of the Islamic menace in 1453 AD and was turned into a Muslim fortress. But now? Now it is under the hands of the faithful once more, though the Romanovs live within these walls in exile, nearly losing their lives to the godless Bolsheviks. Since then, the Russian nobility and the Greek-speaking natives have lived in relative peace, though the latter are rather suspicious of these Slavic occupants. Are they truly among the ranks of the faithful or are they simply invaders?"
 TSA_Defenders_of_the_Orthodox_Faith: "Defenders of the Orthodox Faith"
 TSA_Defenders_of_the_Orthodox_Faith_desc: "Eastern Orthodoxy is the very foundation of our Christian faith and the vital organ to the sacred city of Tsargrad.  Since the Great Schism of 1054 AD, which was due to the rejection of the Pope's unfounded claim to universal jurisdiction, the Eastern Orthodox Church has long been the continuation of true Christendom and the sacred teachings of Holy Scripture, first symbolized by the Byzantine Empire and then by Russia, the Third Rome. Now, it is the last major refuge of a religion on the brink after the city's liberation from the Ottoman yoke during The Great War, constantly threatened by Islam in the east and Bolshevism in the north. Tsargrad must stand ready to defend the sacred jewel of the faith by any means necessary, whether by reviving its ancient Byzantine glory or becoming the Romanovs' main base of operations for the liberation of Russia."
