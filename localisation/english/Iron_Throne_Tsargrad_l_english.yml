 TSA_the_clock_is_ticking_desc: "The administration of Tsargrad is at a crossroads. The health of Prince Alexei is steadily declining, the ethnic makeup of our country is flaming the embers of racial strife, and the Great Depression is only deepening. Decisive action must be taken to preserve our nation in the face of enemies on all fronts, and that change must come about from the Regency Council."
