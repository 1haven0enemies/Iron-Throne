 liberal_corporatism:0 "Liberal Corporatism"
 liberal_corporatism_desc:0 ""
 libertarianism:0 "Libertarianism"
 libertarianism_desc:0 "Libertarianism is a political philosophy that holds freedom, personal sovereignty, and liberty as primary values. It believes in a very limited government and the individual's natural self evident rights of life, liberty, and property. In regards to economics, it strongly supports laissez-faire capitalism as the ideal economic system for society, believing that a free society cannot be achieved without a free market. Its theory of individual rights generally follows the homestead principle and the labor theory of property, stressing self-ownership and that people have an absolute right to the property that their labor produces."
