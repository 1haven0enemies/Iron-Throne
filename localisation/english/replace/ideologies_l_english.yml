 national_populism:0 "National Populism"
 national_populism_desc:0 "National Populism is a broad term for political ideologies associated with authoritarian ultranationalism involving a rejection of liberalism and socialism in favor of a traditionalist, militaristic, and one-party authoritarian state. A common consensus among various organizations under the National Populist umbrella is that only a strong figure of authority can unify a nation and its people under the state. Regimes under the National Populist label tend to have a monopoly on power within the state, having control or influence over the police, military, legislature, and general political scene. Within the system they use state resources to inflict terror upon their people through various means, ranging from an omnipresent network of secret informants, the mass surveillance of large sections of the population, or through the establishment of concentration camps to be able to guard against any potentially suspicious individuals or groups."
 national_romanticism:0 "National Romanticism"
 national_romanticism_desc:0 "National Romanticism is a far-right, reactionary, ultranationalist ideology founded by C.S Lewis in 1923 that holds a strict adherence towards traditionalism, anti-capitalism, anti-feminism, anti-esotericism, anti-socialism, militarism, and aristocracy. It is a staunchly totalitarian form of conservative nationalism that espouses a national collectivist community with a strong emphasis on patriarchal family norms, cultural chauvinism, passion, intuition, the celebration of the heroic, and undying loyalty to the fatherland. Economically, it promotes a corporatist economic system that espouses class collaboration while, ironically, holding an elitist and hierarchical view of society."
 national_salvation_movement:0 "National Salvation Movement"
 national_salvation_movement_desc:0 ""
 nationalist_warlordism:0 "Nationalist Warlordism"
 nationalist_warlordism_desc:0 ""
 nordicism:0 "Nordicism"
 nordicism_desc:0 "Nordicism is an ideology which views the "Nordic race" as an endangered and superior racial group, stressing the notion that they alone are destined to rule over the rest of humanity. It also supports the idea that people of Nordic stock, including the Anglo-Saxons, Northern French, Germanics, Balts, Baltic Finns, Scandinavians, and Celts, are even superior to the other European phenotypes. Nordicists claim that Nordics had formed upper tiers of ancient civilisations, even in the Mediterranean civilisations of antiquity, which had declined once this dominant race had been assimilated. Many of the Nordicists' ideas were popularized by thinkers such as Madison Grant, Arthur de Gobineau, Lothrop Stoddard, and Houston Stewart Chamberlain."
 panchayat_system:0 "Panchayat System"
 panchayat_system_desc:0 ""
 patriot_populism:0 "Patriot Populism"
 patriot_populism_desc:0 ""
 reactionary_modernism:0 "Reactionary Modernism"
 reactionary_modernism_desc:0 ""
 reactionary_nationalism:0 "Reactionary Nationalism"
 reactionary_nationalism_desc:0 ""
 religious_zionism:0 "Religious Zionism"
 religious_zionism_desc:0 ""
 right_wing_populism:0 "Right-Wing Populism"
 right_wing_populism_desc:0 ""
 sanationism:0 "Sanationism"
 sanationism_desc:0 ""
 sikh_nationalism:0 "Sikh Nationalism"
 sikh_nationalism_desc:0 ""
 solidarism:0 "Solidarism"
 solidarism_desc:0 ""
 tseghakronism:0 "Tseghakronism"
 tseghakronism_desc:0 ""
 zionism:0 "Zionism"
 zionism_desc:0 "Zionism is a nationalist ideology that emerged in Europe in the late 19th century that believes that the best solution to the "Jewish question" is to create a nation for Jews in the Holy Land. Zionism initially emerged in Central and Eastern Europe as a secular nationalist movement in the late 19th century, in reaction to newer waves of antisemitism and in response to the Haskalah, or Jewish Enlightenment. Fundamental to Zionism is the belief that Jews constitute a nation, and have a moral and historic right and need for self-determination in Palestine. This belief developed out of the experiences of European Jewry, which the early Zionists believed demonstrated the danger inherent to their status as a minority. In contrast to the Zionist notion of nationhood, the Judaic sense of being a nation was rooted in religious beliefs of unique chosenness and divine providence, rather than in ethnicity."
