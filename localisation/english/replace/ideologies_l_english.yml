 codreanuism:0 "Codreanusim"
 codreanuism_desc:0 "Codreanuism, or Romanian Legionarism, is an ultranationalist, religious, social Darwinist ideology that ties its sense of national pride and unity with the Eastern Orthodox faith. Despite its strict adherence to racialized Darwinian principles, it calls for a revolutionary "new man", though this is not defined in physical terms, as with the National Socialists in Germany or the Franco-Darwinists in France, but is aimed at recreating and purifying oneself to bring the whole nation closer to God. Thus, Codreanuism can best be described a kind of palingenetic ultranationalist Christianity with characteristics of both social Darwinism, eugenics, Romanian chauvinism, and national mysticism added to the mix."
