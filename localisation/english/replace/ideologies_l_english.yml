 rondonism:0 "Rondonism"
 rondonism_desc:0 "" 
 scientific_utopianism:0 "Scientific Utopianism"
 scientific_utopianism_desc:0 "Scienftific Utopianism refers to a movement that aims to establish a utopian society rooted in science, technology, and human reason. It espouses for a rationalsitic society which, while not hostile to religion, ultimately rejects religious inteference in political affairs while aiming to create an egalitarian society rooted in class collaboration, moral universialism, and belief in the human spirit. Some members of this movement hold authoritarian tendencies while others hold democratic or anarchist political beliefs." 
 scientific_feminism:0 "Scientific Feminism"
 scientific_feminism_desc:0 "" 
 secular_zionism:0 "Secular Zionism"
 secular_zionism_desc:0 "" 
 societalism:0 "Societalism"
 societalism_desc:0 "Societalism is a totalitarian collectivist ideology rooted in militant atheism and the normative ethical theories of utilitarianism, which promote actions that maximize happiness and well-being for the affected individuals. Believing that actions that lead to the greatest good for the greatest number are the only means of bringing about further progress for the human race, Societalists strongly reject religion, individualism, class conflict, racism, and sexism to the point where they find such things as being an existential threat towards the entire human species as a whole. In some cases, this would invovle a systematic purging of these very elements within society that they find to be too dangerous and, therefore, detrimental to the progress and prosperity of the collective whole."
