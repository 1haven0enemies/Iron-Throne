 popular_atheism:0 "Popular Atheism"
 popular_atheism_desc:0 "Popular Atheism, or Atheist Populism, refers to broad collection of anti-religious, staunchly atheistic populist movements that reject the belief in divine beings and religious tradition while promoting the complete secularization of society while under the influence of charismatic demagogues who hold anti-clerical views. Those who refer to themselves as "Popular Atheists" often hold firmly in a corporatist economy rooted in science, technological innovation, and logic, combined with a belief in direct democracy." 
 promethean_technocracy: "Promethean Technocracy"
 promethean_technocracy_desc:0 "Promethean Technocracy refers to a utopian ideology that advocates for the establishment of a technocratic humanist state run by an enlightened regime, be it an autocracy or an oligarchy, while staunchly rejecting religion under the belief that it exists only as a source of misery, division, and strife. It is a staunchly atheistic ideology that seeks to establish a scientific vanguard to guide the human race towards ultimate perfection by any means necessary, aiming to achieve a post-scarcity economy beyond capitalism, socialism, communis, and corporatism, and purging society of any and all religious beliefs and mystical superstitions. Critics of this ideology, hoever, would often criticize the Promethan Technocratic movement of promoting totalitarian rule, oppresive heirarchies, and an outright rejection of ethical restraint.""
