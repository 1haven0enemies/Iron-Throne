 anarcho_capitalism:0 "Anarcho-Capitalism"
 anarcho_capitalism_desc:0 "Anarcho-Capitalism, sometimes known as Anarcho-Liberalism, is an anarchist school of thought that combines the principles of anarchism with classical liberal conceptions of property rights and individualism, aiming for the elimination of the state in favor of a free-market capitalist form of anarchism that replaces centralized bureaucratic governance with a voluntary free associations. Most Anarcho-Capitalists adhere to the rejection of all physical aggression in favor of the non-aggresison principle (NAP), which views violence and force as illegitimate and should be prohibited for the sake of property rights and individual freedoms."
 austrian_school:0 "Austrian School"
 austrian_school_desc:0 "The Austrial School is a heterodox school of economic thought originating from Vienna in 1871 that advocates strict adherence to methodological individualism, the concept that social phenomena result primarily from the motivations and actions of individuals along with their self interest. Austrian-school theorists hold that economic theory should be exclusively derived from basic principles of human action."
 christian_libertarianism:0 "Christian Libertarianism"
 christian_libertarianism_desc:0 ""
 distributism:0 "Distributism"
 distributism_desc:0 ""
 economic_darwinism:0 "Economic Darwinism"
 economic_darwinism_desc:0 "Economic Darwinism refers to an individualist capitalist ideology based on the philosophical works of the British philosopher Herbet Spencer, who coined the term 'survivial of the fittest' and sought to implement Darwin's theories to human society. It also promotes individualism and believes that the role of the state should be maximally limited, allowing for laissez-faire capitalism to take root and that individuals would be free to pursue their goals and have civil liberties without intervention of the state. It staunchly opposes welfare and believes that the state should only protect individuals from violence and fraud."
 fiscal_conservatism:0 "Fiscal Conservatism"
