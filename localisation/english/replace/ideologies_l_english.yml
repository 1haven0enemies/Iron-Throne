 #Accelerationist Sub-ideologies#
 anarcho_absurdism:0 "Anarcho-Absurdism"
 anarcho_absurdism_desc:0 "Anarcho-Absurdism is an anarchist ideology rooted in the philosophy of absurdism, which has its roots in the works of the 19th-century Danish philosopher Søren Kierkegaard. According to absurdist thought, the universe is irrational and meaningless. It states that trying to find meaning leads people into conflict with a seemingly meaningless world. This conflict can be between rational man and an irrational universe, between intention and outcome, or between subjective assessment and objective worth, but the precise definition of the term is disputed. Absurdism claims that, due to one or more of these conflicts, existence as a whole is absurd. Absurdists don't necessarily reject the search for meaning, but instead, they embrace the absurdity of the human condition and strive to find meaning within the meaningless. This mentality is shared with the Anarcho-Absurdists, who reject the state, religion, tradition, and other institutions in the hopes of establishing a creative, individualistic anarchist society free from coercion where people are able to live their own lives and find meaning in an absurd, random world."
 anarcho_primitivism:0 "Anarcho-Primitivism"
 anarcho_primitivism_desc:0 "Anarcho-Primitivism is  a political and ethical movement that combines anarchist principles with a critique of civilization, advocating for a return to non-civilized ways of life through deindustrialization and the abolition of societal structures. Adherents of this ideology believe that before the widespread use of agriculture, humans lived in egalitarian hunter-gatherer tribes. They believe that after the introduction of agriculture, humans slowly began to become obsessed with technology, and divisions of labour began to cause inequality. They disagree on whether they should return to hunter-gatherer tribes, use permaculture, or both."
 anarcho_surrealism:0 "Anarcho-Surrealism"
 anarcho_surrealism_desc:0 "Anarcho-Surrealism is an avant-garde anarchist ideology that has its roots in the artistic and philosophical movement known as Surrealism, explores the subconscious and irrational to challenge conventional reality, often featuring dreamlike imagery, unexpected juxtapositions, and a focus on the unconscious mind. As a political movement, Anarcho-Surrealists aim for the total revolt against hierarchy, traditionalism, religion, the state, and reality itself, seeking to create a 'society of the surreal' and bring about a new cultural revolution that would explore the unconscious and free humanity of the oppressive chains of the real."
 apocalypticism:0 "Apocalypticism"
 apocalypticism_desc:0 "Apocalypticism refers to a broad collection of cult-like religious ideologies that preach about the end of days, even within one's own lifetime, though exactly how it would play out depends on the speifici religion and beliefs of the cult in question. This belief is usually accompanied by the idea that civilization will soon come to a tumultuous end due to some sort of catastrophic global event. Apocalypticism is one aspect of eschatology in certain religions, the part of theology concerned with the final events of human history, or the ultimate destiny of humanity (societal collapse, human extinction, and so on)."
 ascensionism:0 "Ascensionism"
 ascensionism_desc:0 "" 
 avant_garde_nationalism:0 "Avant-Garde Nationalism"
 avant_garde_nationalism_desc:0 "Avant-Garde Nationalism combines the cultural radicalism of the avant-garde movement of the art world with a deeply nationalistic devotion to one's fatherland. By combining the yearning of a radical cultural revolution with a sens eof national pride and duty to one's soil, it can be best be described as a sort of chauvinistc form of artistic modernism that seeks to do away with religion, rationality, socialism, capitalism, and traditional family norms. To what extent that the believers of Avant-Garde Nationalism are willing to go to realize their aims depends on what specific movement within the avant-garde art community and country they belong to."
 cosmicism:0 "Cosmicism"
 cosmicism_desc:0 "Cosmicism refers to an ideology that integrates science, religion, and metaphysics into a unified worldview. It is characterized by the belief in humanity’s cosmic destiny, the potential for immortality, and the use of scientific and technological advancements to achieve control over nature and explore space."
 futurism:0 "Futurism"
 futurism_desc:0 "" 
 hegemonism:0 "Hegemonism"
 hegemonism_desc:0 ""
 marxist_accelerationism:0 "Marxist Accelerationism"
 marxist_accelerationism_desc:0 "" 
 marxist_gastevism:0 "Marxist-Gastevism"
 marxist_gastevism_desc:0 "" 
 nouvelle_revolution_nationale:0 "Nouvelle Révolution Nationale"
 nouvelle_revolution_nationale_desc:0 "" 
 oligarchal_collectivism:0 "Oligarchal Collectivism"
 oligarchal_collectivism_desc:0 "" 
 plasirism:0 "Plasirism"
 plasirism_desc:0 "Plasirism is an ideology developed by the French philosopher Georges Bataille that pushes for the pursuit of sovereignty through the transgression of norms, the embrace of unproductive expenditure, and a radical reevaluation of meaning and human experience rooted in the sacred as excess eroticism, and sacrifice. Hedonistic in nature, Plasirism derives from the French word for 'pleasure,' indicaitng its aims of relaizing its vision for society. It also believes that sacrifice is not simply an act of destruction but a profound experience of openness, one that disrupts the closed and stable boundaries that define human existence."
 premillennialism:0 "Premillenialism"
 premillennialism_desc:0 "Premillenialism  is the belief that Jesus will physically return to the Earth via the Second Coming before the Millennium, heralding a literal thousand-year messianic age of peace. This is based off of a literal interpretation of the Book of Revelation and its followers are known to holding a cult mentality and, in rare and extreme cases, would sometimes perform human sacrifices via 'expiation' as a means of seeking the redeeming grace of God."
 social_darwinism:0 "Social Darwinism"
 social_darwinism_desc:0 "Social Darwinism is a ruthless ideology that attempts to apply Darwin's theory of natural selection to human societies, arguing that some groups are inherently superior and destined to dominate others, often used to justify social inequalities and discrimination. Social Darwinism believes that human groups and races are subject to the same natural selection laws as plants and animals. It also posited that the weak diminished while the strong gained power and cultural influence, summarizing human society as a "survival of the fittest" struggle. Proponents like Spencer, Walter Bagehot, and William Graham Sumner believed natural selection led to the survival of the best competitors, improving populations over time."
 spiritualist_collectivism:0 "Spiritual Collectivism"
 spiritual_collectivism_desc:0 "" 
 state_isolationism:0 "State Isolationism"
 state_isolationism_desc:0 "" 
 ultramilitarism:0 "Ultramilitarism"
 ultramilitarism_desc:0 "" 
 utopian_feudalism:0 "Utopian Feudalism"
 utopian_feudalism_desc:0 "" 
 volkisch_primitivism:0 "Völkisch Primitivism"
 volkisch_primitivism_desc:0 "Völkisch Primitivism is a primtivist interpretation of Esoteric Naitonal Socialism created by the German artist Fidus that incorporates mysticism, Germanic paganism, organic farming, alternative medicine, prehistory, and the Wandervogel movement into its ideological framework. Holding a deeply anti-industrial, anti-civilizational interpretation of National Socialist ideology, it aims to bring the Germanic people back into a kind of 'primitive innocence' devoid of the constraints of civilization and urban society so that their racial hygiene can be maintained and remain free from what it percieves as 'genetic contamination.' It is also known to have deeply anti-Christian bias that goes hand-in-hand with both its antisemitism and its rejection of modern technology."

