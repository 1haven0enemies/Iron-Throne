 social_libertarianism:0 "Social Libertarianism"
 social_libertarianism_desc:0 "Social Libertarianism, much like its more classical counterpart, is a political philosophy that holds freedom, personal sovereignty, and liberty as primary values. It believes in a very limited government and the individual's natural self evident rights of life, liberty, and property. In regards to economics, it strongly supports laissez-faire capitalism as the ideal economic system for society, believing that a free society cannot be achieved without a free market. Its theory of individual rights generally follows the homestead principle and the labor theory of property, stressing self-ownership and that people have an absolute right to the property that their labor produces. What distinguishes it from its more classical verison, however, is that it promotes culturally progressive reforms and a market-friendly approach towards welfare."
 
