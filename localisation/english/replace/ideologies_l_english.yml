 #Reactionary Socialist Sub-ideologies#
 authenticism:0 "Authenticism"
 authenticism_desc:0 "Authenticism refers to a collection of reactionary socialist ideologies within Africa, South America, Central America, Oceania, and the Southern Pacific that vehemently rejects Western culture and society while stressing for a traditionalist, collectivist society that aims to 'decolonize' the 'oppressed' peoples and return to a pre-colonial, pre-Western state of civilization mixed with a socialistic economy. Inspired by the works of Oswald Spengler, Authenticism aims to liberate the oppressed tribes of the world and root out the yoke of Western imperialism from their rightful ancestral lands and reawaken the cultural and spiritual ways of their ancestors."
