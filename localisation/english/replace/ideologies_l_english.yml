 authoritarian_democracy:0 "Authoritarian Democracy"
 authoritarian_democracy_desc:0 "Authoritarian Democracy is an ideology that combines strong executive power with a rigged democratic political system, typically a "representative" elected body. The aim of these regimes is to maintain national stability as well as providing the people both a popular and effective government.  Because of their previously stated belief Authoritarian Democratic regimes generally allow certain freedoms and democratic institutions to exist if these don't constitute a threat to their dominance but instead represent a tool to popularize their regime among the masses. However they seek to squash any real opposition, frequently propping up a controlled one to give the populace an illusion of opposition."
